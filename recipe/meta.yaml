{% set name = "napari-imc" %}
{% set version = "0.6.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6c77e90f31a573e4139df11ac80dcbd22f028298b05d818f35b77cf6feed6b7d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.7
    - setuptools-scm
  run:
    - napari
    - napari-plugin-engine >=0.1.4
    - numpy
    - python >=3.7
    - qtpy
    - readimc >=0.5.0
    - superqt

test:
  imports:
    - napari_imc
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://github.com/BodenmillerGroup/napari-imc
  summary: Imaging Mass Cytometry (IMC) file type support for napari
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
    - jwindhager
